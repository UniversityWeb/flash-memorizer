<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" type="image/x-icon" th:href="@{/images/page-icon.svg}">
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
    <link rel="stylesheet" th:href="@{/css/back-navbar.css}">
    <link rel="stylesheet" th:href="@{/css/edit-deck.css}"/>
    <link rel="stylesheet" th:href="@{/richtext/richtext.min.css}">
    <link rel="stylesheet" th:href="@{/richtext/richtext.scss}">
    <title>Edit Deck</title>
</head>
<body class="bg-gray-50">

<header class="flex items-center bg-white shadow p-4">
    <a class="button_back text-indigo-600 hover:text-indigo-800 mr-4" th:href="@{/decks/review/{deckId}(deckId=${deckForm.deck.id})}">
        <ion-icon name="chevron-back-outline" class="text-2xl"></ion-icon>
    </a>
    <h1 class="text-3xl font-bold">Flash Memorizer</h1>
</header>

<section id="notificationSec" class="px-6 py-4">
    <div class="alert-success" id="successMessage" th:if="${successMsg}">
        <span th:text="${successMsg}">Notify the success message!</span>
    </div>

    <div class="alert-error" id="errorMessage" th:if="${errorMsg}">
        <span th:text="${errorMsg}">An error occurred.</span>
    </div>
</section>

<section class="w-full px-6 py-8">
    <div class="max-w-4xl mx-auto">
        <div class="card">
            <div class="p-6">
                <h4 class="text-center text-indigo-600 text-xl font-bold mb-6">Deck Form</h4>

                <form th:action="@{/decks/update}" method="post" id="deckForm" th:object="${deckForm}">
                    <input type="hidden" th:field="*{deck.id}" />

                    <div class="form-group">
                        <label class="block font-semibold mb-2">Name</label>
                        <input type="text" class="input-field" th:field="*{deck.name}" maxlength="50"/>
                    </div>
                    <div class="form-group">
                        <label class="block font-semibold mb-2">Description</label>
                        <textarea class="deckDescEditor input-field" th:field="*{deck.desc}" maxlength="500"></textarea>
                    </div>

                    <!-- Add card details -->
                    <h4 class="text-center text-indigo-600 text-xl font-bold mt-8 mb-6">Cards</h4>

                    <div th:if="${deckForm.cards.isEmpty()}" class="bg-blue-100 border border-blue-400 text-blue-700 p-4 rounded text-center">
                        <p class="text-lg font-semibold mb-0">You haven't created any cards</p>
                    </div>

                    <div th:if="${not deckForm.cards.isEmpty()}">
                        <ul id="cardList" class="space-y-4">
                            <li class="border rounded p-4 bg-white shadow" th:each="curCard, stat : ${deckForm.cards}">
                                <div class="mb-3 relative">
                                    <div class="flex justify-end gap-2">
                                        <a class="border border-indigo-600 text-indigo-600 hover:bg-indigo-100 px-3 py-2 rounded text-sm edit-button"
                                           th:href="@{/cards/edit(cardId=${curCard.id})}">
                                            ✏️ Edit
                                        </a>

                                        <a class="border border-red-600 text-red-600 hover:bg-red-100 px-3 py-2 rounded text-sm delete-button"
                                           th:href="@{/cards/delete(cardId=${curCard.id}, deckId=${deckForm.deck.id})}">
                                            🗑️ Delete
                                        </a>
                                    </div>

                                    <!-- Use th:field for the hidden input field -->
                                    <input type="hidden" th:field="*{cards[__${stat.index}__].id}" />

                                    <div class="grid grid-cols-2 gap-4 mt-4">
                                        <div>
                                            <label class="block font-semibold mb-2">Term</label>
                                            <div class="bg-white rounded border p-4 font-mono"
                                                 th:utext="*{cards[__${stat.index}__].term}">
                                                [Term]
                                            </div>
                                        </div>
                                        <div>
                                            <label class="block font-semibold mb-2">Description</label>
                                            <div class="bg-white rounded border p-4 font-mono"
                                                 th:utext="*{cards[__${stat.index}__].desc}">
                                                [Desc]
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>

                    <div class="flex justify-center mt-6 mb-4">
                        <a class="border border-green-600 text-green-600 hover:bg-green-100 px-4 py-2 rounded"
                           th:href="@{/cards/input/{deckId}(deckId=${deckForm.deck.id})}">
                            ➕ Add Another Card
                        </a>
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 text-white py-3 px-4 rounded hover:bg-indigo-700 font-bold">Save Deck And Return</button>
                </form>
            </div>
        </div>
    </div>
</section>

<script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>

<script th:src="@{/richtext/jquery.richtext.js}"></script>
<script th:src="@{/js/custom-richtext.js}"></script>
<script th:inline="javascript">
    $(document).ready(function() {
        $('.deckDescEditor').richText(customEditor);
    });
</script>

<script>
    $(document).ready(function () {
        const notificationSec = $('#notificationSec')
        const successMessage = $('#successMessage');
        const errorMessage = $('#errorMessage');

        if (successMessage.length > 0 || errorMessage.length > 0) {
            setTimeout(function () {
                notificationSec.fadeOut('slow');
            }, 5000);
        }
    });
</script>
</body>
</html>
