<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" type="image/x-icon" th:href="@{/images/page-icon.svg}">
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
    <link rel="stylesheet" th:href="@{/css/back-navbar.css}">
    <link rel="stylesheet" th:href="@{/richtext/richtext.min.css}">
    <link rel="stylesheet" th:href="@{/richtext/richtext.scss}">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <title>Deck Input</title>
</head>
<body class="bg-gray-50">

<header class="flex items-center bg-white shadow p-4">
    <a class="button_back text-indigo-600 hover:text-indigo-800 mr-4" th:href="@{/decks/get-my-decks}">
        <ion-icon name="chevron-back-outline" class="text-2xl"></ion-icon>
    </a>
    <h1 class="text-3xl font-bold">Flash Memorizer</h1>
</header>

<section class="w-full px-6 py-8">
    <div class="max-w-4xl mx-auto">
        <div class="card">
            <div class="p-6">
                <h4 class="text-center text-indigo-600 text-xl font-bold mb-6">Deck</h4>

                <form th:action="@{/decks/add}" method="post" id="deck" th:object="${deck}">
                    <div class="form-group">
                        <label class="block font-semibold mb-2">Name</label>
                        <input type="text" class="input-field" th:field="*{name}" maxlength="50" />
                    </div>
                    <div class="form-group">
                        <label class="block font-semibold mb-2">Description</label>
                        <textarea class="deckDescEditor input-field" th:field="*{desc}" maxlength="500"></textarea>
                    </div>

                    <input type="hidden" th:field="*{user.id}" />

                    <button type="submit" class="w-full bg-indigo-600 text-white py-3 px-4 rounded hover:bg-indigo-700 font-bold">Add And Move To Details</button>
                </form>
            </div>
        </div>
    </div>
</section>

<script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

<script th:src="@{/richtext/jquery.richtext.min.js}"></script>
<script th:src="@{/js/custom-richtext.js}"></script>
<script>
    $(document).ready(function() {
        $('.deckDescEditor').richText(customEditor);
    });
</script>

</body>
</html>
